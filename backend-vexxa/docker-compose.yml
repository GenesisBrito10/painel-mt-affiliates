version: '3.8'

services:
  vexxa-postgres:
    image: postgres:16-alpine
    container_name: vexxa-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vexxa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vexxa_password}
      POSTGRES_DB: ${POSTGRES_DB:-vexxa_db}
    ports:
      - '5433:5432'
    volumes:
      - vexxa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vexxa_user} -d ${POSTGRES_DB:-vexxa_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  vexxa-redis:
    image: redis:7-alpine
    container_name: vexxa-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - vexxa-redisdata:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-vexxa_redis_password}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-vexxa_redis_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vexxa-pgdata:
  vexxa-redisdata:

