<style>
  .vex-spa-loader {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f6f5f2;
    color: #1c1917;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    .vex-spa-loader {
      background: #0b0d10;
      color: #e5e7eb;
    }
  }

  .vex-spa-loader__box {
    width: min(100%, 360px);
    display: grid;
    justify-items: center;
    gap: 18px;
    text-align: center;
  }

  .vex-spa-loader__mark {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    background: transparent;
    filter: drop-shadow(0 10px 16px rgba(245, 158, 11, 0.28));
  }

  .vex-spa-loader__mark img {
    width: 52px;
    height: 52px;
    object-fit: contain;
  }

  .vex-spa-loader__title {
    margin: 0;
    font-size: 16px;
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: 0;
  }

  .vex-spa-loader__bar {
    width: 168px;
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.18);
  }

  .vex-spa-loader__bar::after {
    content: "";
    display: block;
    width: 46%;
    height: 100%;
    border-radius: inherit;
    background: #f59e0b;
    animation: vex-spa-loader-slide 1.05s ease-in-out infinite;
  }

  @keyframes vex-spa-loader-slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(230%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .vex-spa-loader__bar::after {
      animation: none;
      width: 100%;
    }
  }
</style>

<div class="vex-spa-loader" role="status" aria-live="polite">
  <div class="vex-spa-loader__box">
    <div class="vex-spa-loader__mark" aria-hidden="true">
      <img src="/mt-affiliates-icon-192.png" alt="">
    </div>
    <p class="vex-spa-loader__title">Carregando MT Affiliates</p>
    <div class="vex-spa-loader__bar" aria-hidden="true"></div>
  </div>
</div>
